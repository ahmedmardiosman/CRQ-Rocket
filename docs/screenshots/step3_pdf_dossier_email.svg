<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" style="background:#0f172a; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <filter id="shadow3" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Browser Window Frame -->
  <g filter="url(#shadow3)">
    <rect x="40" y="30" width="1120" height="720" rx="12" fill="#f8f9fa"/>
    
    <!-- Titlebar -->
    <path d="M 40 42 Q 40 30 52 30 L 1148 30 Q 1160 30 1160 42 L 1160 74 L 40 74 Z" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
    <circle cx="65" cy="52" r="6" fill="#ea4335"/>
    <circle cx="85" cy="52" r="6" fill="#fbbc04"/>
    <circle cx="105" cy="52" r="6" fill="#34a853"/>
    <text x="140" y="57" font-size="12" fill="#202124" font-weight="600">CRQ-Rocket · Step 3: Broadcast Delivery &amp; CAB PDF Dossier</text>

    <!-- Split Screen: Left = Monochrome CAB PDF Dossier; Right = Email Dispatch Screen -->
    
    <!-- LEFT SIDE: Formal Monochrome A4 PDF Dossier -->
    <g transform="translate(65, 95)">
      <!-- A4 Page Simulation -->
      <rect x="0" y="0" width="460" height="625" rx="4" fill="#ffffff" stroke="#bdc1c6" stroke-width="1"/>
      
      <!-- Black Header Banner -->
      <rect x="15" y="15" width="430" height="28" fill="#000000"/>
      <text x="25" y="33" font-size="9" font-weight="700" fill="#ffffff" letter-spacing="1">CHANGE ADVISORY BOARD (CAB) FORMAL DOSSIER</text>
      <text x="435" y="33" font-size="8" fill="#ffffff" text-anchor="end">RESTRICTED</text>

      <!-- Document Title -->
      <text x="15" y="65" font-size="13" font-weight="800" fill="#000000">CRQ Report: DEF-702 - Redis Pool Leak Fix</text>
      <line x1="15" y1="72" x2="445" y2="72" stroke="#000000" stroke-width="1.5"/>

      <!-- Metadata Grid -->
      <rect x="15" y="80" width="430" height="52" fill="#f8f9fa" stroke="#000000" stroke-width="0.8"/>
      <text x="25" y="96" font-size="8" font-weight="700">DEFECT ID:</text>
      <text x="80" y="96" font-size="8">DEF-702</text>
      
      <text x="160" y="96" font-size="8" font-weight="700">RISK LEVEL:</text>
      <text x="220" y="96" font-size="8">MEDIUM (CAB Review)</text>
      
      <text x="320" y="96" font-size="8" font-weight="700">RELEASE DATE:</text>
      <text x="390" y="96" font-size="8">2026-10-15</text>

      <text x="25" y="118" font-size="8" font-weight="700">SUBMITTER:</text>
      <text x="80" y="118" font-size="8">Ahmed Mardi</text>
      <text x="160" y="118" font-size="8" font-weight="700">ROLE:</text>
      <text x="220" y="118" font-size="8">Lead Software Eng</text>
      <text x="320" y="118" font-size="8" font-weight="700">CAB STATUS:</text>
      <text x="390" y="118" font-size="8" font-weight="700">PENDING</text>

      <!-- Section: Implementation Summary -->
      <rect x="15" y="142" width="430" height="18" fill="#e0e0e0"/>
      <text x="22" y="155" font-size="8.5" font-weight="800">1. TECHNICAL IMPLEMENTATION SUMMARY</text>
      <text x="15" y="176" font-size="8" fill="#333333">Remediated Redis connection pooling parameters to prevent exhaustion</text>
      <text x="15" y="190" font-size="8" fill="#333333">during peak traffic. Applied idle socket reaping and max connection ceiling.</text>
      
      <rect x="25" y="200" width="410" height="35" fill="#f0f0f0" stroke="#cccccc" stroke-width="0.5"/>
      <text x="35" y="215" font-size="7.5" font-family="monospace">const pool = createPool({ max: 50, idleTimeoutMillis: 30000 });</text>
      <text x="35" y="228" font-size="7.5" font-family="monospace">await pool.acquire(); // Connection lifecycle managed via try/finally</text>

      <!-- Section: Validation -->
      <rect x="15" y="245" width="430" height="18" fill="#e0e0e0"/>
      <text x="22" y="258" font-size="8.5" font-weight="800">2. PRE-DEPLOYMENT VALIDATION &amp; TEST PROCEDURES</text>
      <text x="15" y="278" font-size="8" fill="#333333">Simulated 10,000 req/sec over 45 min staging load test with k6 framework.</text>
      <text x="15" y="292" font-size="8" fill="#333333">Observed 0 socket timeouts, 0 HTTP 504 errors, and stable 240MB memory footprint.</text>

      <!-- Formal Sign-Off Table -->
      <rect x="15" y="320" width="430" height="70" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
      <line x1="15" y1="340" x2="445" y2="340" stroke="#000000" stroke-width="0.5"/>
      <line x1="150" y1="320" x2="150" y2="390" stroke="#000000" stroke-width="0.5"/>
      <line x1="300" y1="320" x2="300" y2="390" stroke="#000000" stroke-width="0.5"/>

      <text x="25" y="334" font-size="8" font-weight="700">ROLE</text>
      <text x="160" y="334" font-size="8" font-weight="700">NAME / SIGNATURE</text>
      <text x="310" y="334" font-size="8" font-weight="700">DATE</text>

      <text x="25" y="356" font-size="7.5">Lead Developer</text>
      <text x="160" y="356" font-size="7.5">Ahmed Mardi (Signed)</text>
      <text x="310" y="356" font-size="7.5">2026-10-04</text>

      <text x="25" y="378" font-size="7.5">CAB Chair</text>
      <text x="160" y="378" font-size="7.5">Pending CAB Board Review</text>
      <text x="310" y="378" font-size="7.5">Pending</text>

      <!-- Footer -->
      <line x1="15" y1="600" x2="445" y2="600" stroke="#aaaaaa" stroke-width="0.5"/>
      <text x="15" y="614" font-size="7" fill="#666666">CRQ-Rocket Dossier | DEF-702 | Confidential - CAB Review Only</text>
      <text x="445" y="614" font-size="7" fill="#666666" text-anchor="end">Page 1 of 1</text>
    </g>

    <!-- RIGHT SIDE: Email Dispatch & Launcher Interface -->
    <g transform="translate(560, 95)">
      <rect x="0" y="0" width="560" height="625" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>

      <!-- Success Header -->
      <rect x="25" y="25" width="510" height="65" rx="8" fill="#e6f4ea" stroke="#ceead6" stroke-width="1"/>
      <circle cx="55" cy="57" r="16" fill="#34a853"/>
      <text x="49" y="63" font-size="16" font-weight="800" fill="#ffffff">✓</text>
      <text x="85" y="48" font-size="14" font-weight="700" fill="#137333">CRQ Ready &amp; Packaged</text>
      <text x="85" y="68" font-size="11" fill="#3c4043">Dossier generated with monochrome A4 PDF &amp; stakeholder email text</text>

      <!-- Card: Launch Email with Attached PDF -->
      <rect x="25" y="105" width="510" height="150" rx="8" fill="#f8f9fa" stroke="#dadce0" stroke-width="1"/>
      <text x="45" y="132" font-size="13" font-weight="700" fill="#202124">✉ Send Email with Attached PDF</text>
      <rect x="420" y="118" width="95" height="20" rx="10" fill="#e6f4ea"/>
      <text x="432" y="132" font-size="10" font-weight="700" fill="#137333">READY TO SEND</text>

      <text x="45" y="158" font-size="11" fill="#5f6368">Click below to open your email compose window with the pre-filled message,</text>
      <text x="45" y="174" font-size="11" fill="#5f6368">subject, and recipients. The PDF dossier is downloaded simultaneously.</text>

      <!-- Launch Buttons -->
      <rect x="45" y="195" width="180" height="42" rx="6" fill="#1a73e8"/>
      <text x="65" y="221" font-size="12" font-weight="700" fill="#ffffff">Open in Email Client ↗</text>

      <rect x="235" y="195" width="165" height="42" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
      <text x="255" y="221" font-size="12" font-weight="600" fill="#d93025">Open in Gmail Web ↗</text>

      <!-- Recipient Breakdown -->
      <rect x="25" y="270" width="510" height="150" rx="8" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
      <text x="45" y="295" font-size="12" font-weight="700" fill="#202124">Target Recipient Manifest (3 Recipients):</text>
      
      <rect x="45" y="310" width="195" height="26" rx="4" fill="#f1f3f4"/>
      <text x="55" y="327" font-size="10.5" fill="#3c4043" font-family="monospace">cab-approval@company.internal</text>

      <rect x="250" y="310" width="165" height="26" rx="4" fill="#f1f3f4"/>
      <text x="260" y="327" font-size="10.5" fill="#3c4043" font-family="monospace">qa-lead@company.internal</text>

      <rect x="45" y="345" width="165" height="26" rx="4" fill="#f1f3f4"/>
      <text x="55" y="362" font-size="10.5" fill="#3c4043" font-family="monospace">sre-team@company.internal</text>

      <line x1="45" y1="385" x2="515" y2="385" stroke="#e8eaed" stroke-width="1"/>
      <text x="45" y="405" font-size="11" fill="#1a73e8" font-weight="600">← Back to Review Screen to Send to Other Recipients</text>

      <!-- Download Dossier & Reset -->
      <rect x="25" y="440" width="245" height="40" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
      <text x="45" y="465" font-size="12" font-weight="600" fill="#1a73e8">📥 Download CAB PDF Dossier</text>

      <rect x="285" y="440" width="250" height="40" rx="6" fill="#ffffff" stroke="#dadce0" stroke-width="1"/>
      <text x="325" y="465" font-size="12" font-weight="600" fill="#5f6368">🔄 Create Another CRQ</text>
    </g>
  </g>
</svg>
